apiVersion: batch/v1
kind: CronJob
metadata:
  name: nodered-backup
  namespace: default
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: backup
              image: amazon/aws-cli:latest
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: s3-creds
                      key: access
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: s3-creds
                      key: secret
                - name: AWS_ENDPOINT_URL
                  value: "http://minio-service.default.svc.cluster.local:9000"
              command:
                - /bin/sh
                - -c
                - |
                  # Configure endpoint explicitly for older aws-cli versions or if ENV is ignored
                  aws configure set default.s3.signature_version s3v4
                  
                  echo "Installing dependencies..."
                  yum install -y tar gzip

                  echo "Creating backup..."
                  tar -czf /tmp/nodered-data-$(date +%s).tgz /data
                  
                  echo "Uploading to S3..."
                  aws --endpoint-url $AWS_ENDPOINT_URL s3 cp /tmp/nodered-data-*.tgz s3://project-data-backup/nodered/ || exit 1
                  
                  echo "Done."
              volumeMounts:
                - name: data
                  mountPath: /data
          restartPolicy: OnFailure
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: nodered-pvc