apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodered
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodered
  template:
    metadata:
      labels:
        app: nodered
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - nodered
            topologyKey: "kubernetes.io/hostname"
      containers:
      - name: nodered
        image: nodered/node-red:latest
        ports:
        - containerPort: 1880
        envFrom:
        - configMapRef:
            name: nodered-config
        - secretRef:
            name: nodered-secrets
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: nodered-pvc