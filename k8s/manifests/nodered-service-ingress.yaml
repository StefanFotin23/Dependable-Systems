apiVersion: v1
kind: Service
metadata:
  name: nodered-service
  namespace: default
spec:
  selector:
    app: nodered
  ports:
    - protocol: TCP
      port: 80
      targetPort: 1880
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nodered-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # For kind with self-signed certs, we might need a different issuer or approach
    # Using a self-signed issuer for now
    cert-manager.io/cluster-issuer: "selfsigned-issuer"
spec:
  rules:
  - host: nodered.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nodered-service
            port:
              number: 80
  tls:
  - hosts:
    - nodered.local
    secretName: nodered-tls-secret
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
