kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: rss-feed-cluster
nodes:
- role: control-plane
  # port forward 80 and 443 to the host machine
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  - containerPort: 80
    hostPort: 41080
    protocol: TCP
  - containerPort: 443
    hostPort: 41443
    protocol: TCP
- role: worker
- role: worker
