# Inventory for the Production environment (e.g., a GCP VM).
#
# USAGE:
# 1. Replace <your-gcp-vm-ip> with the actual public IP of your virtual machine.
# 2. Replace <your-ssh-user> with your SSH username on that machine (e.g., ubuntu, stefan).
# 3. Ensure you have configured passwordless SSH access to the VM (using an SSH key).

[k8s_cluster]
prod-vm-1 ansible_host=<your-gcp-vm-ip> ansible_user=<your-ssh-user>
