- name: Check for WSL environment
  ansible.builtin.command: cat /proc/version
  register: kernel_version
  changed_when: false

- name: Set is_wsl fact
  ansible.builtin.set_fact:
    is_wsl: "{{ 'WSL' in kernel_version.stdout }}"

- name: Display environment detection result
  ansible.builtin.debug:
    msg: "WSL environment detected: {{ is_wsl }}. Adjusting storage strategy accordingly."

- name: Check if cluster already exists
  command: kind get clusters
  register: kind_clusters
  changed_when: false

- name: Create kind cluster (dev environment only)
  command: kind create cluster --config {{ kind_config_path }}
  when: (cluster_name not in kind_clusters.stdout) and is_wsl
