- name: "[Prometheus] Add Prometheus community Helm repository"
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: https://prometheus-community.github.io/helm-charts

- name: "[Prometheus] Create monitoring namespace"
  kubernetes.core.k8s:
    name: monitoring
    api_version: v1
    kind: Namespace
    state: present

- name: "[Prometheus] Install kube-prometheus-stack"
  kubernetes.core.helm:
    name: kube-prometheus-stack
    chart_ref: prometheus-community/kube-prometheus-stack
    release_namespace: monitoring
    create_namespace: true
    values:
      alertmanager:
        enabled: false
      prometheus-node-exporter:
        enabled: true
      prometheusOperator:
        enabled: true
      grafana:
        enabled: true
        grafana.ini:
          server:
            root_url: "%(protocol)s://%(domain)s:%(http_port)s/grafana"
            serve_from_sub_path: true
      prometheus:
        prometheusSpec:
          externalUrl: /prometheus

- name: "[Loki] Add Grafana Helm repository"
  kubernetes.core.helm_repository:
    name: grafana
    repo_url: https://grafana.github.io/helm-charts

- name: "[Loki] Install Loki and Promtail for log aggregation"
  kubernetes.core.helm:
    name: loki-stack
    chart_ref: grafana/loki-stack
    release_namespace: monitoring
    values:
      # Keep it lightweight for local dev
      loki:
        replicas: 1
        isDefault: false # Do not set Loki as the default datasource
      promtail:
        enabled: true
      grafana:
        enabled: false # Grafana is already installed by prometheus-stack

- name: "[Observability] Deploy Ingress for Grafana and Prometheus"
  kubernetes.core.k8s:
    state: present
    src: "{{ k8s_manifests_path }}/observability-ingress.yaml"
    kubeconfig: "~/.kube/config"
    context: "kind-{{ cluster_name }}"
