- name: "[NGINX Ingress] Install NGINX Ingress Controller"
  kubernetes.core.k8s:
    state: present
    src: ingress-nginx-kind-deploy.yaml

- name: "[NGINX Ingress] Wait for Ingress Controller to be ready"
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: ingress-nginx
    label_selectors:
      - app.kubernetes.io/component=controller
  register: ingress_nginx_pods
  until: "ingress_nginx_pods.resources | selectattr('status.phase', 'equalto', 'Running') | list | length > 0"
  retries: 30
  delay: 10

- name: "[Cert-Manager] Install Cert-Manager for TLS certificates"
  kubernetes.core.k8s:
    state: present
    src: https://github.com/cert-manager/cert-manager/releases/download/v1.14.5/cert-manager.yaml

- name: "[Cert-Manager] Wait for Cert-Manager to be ready"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: cert-manager
    label_selectors:
      - app.kubernetes.io/component=controller
  register: cert_manager_deployment
  until: "cert_manager_deployment.resources[0].status.availableReplicas is defined and cert_manager_deployment.resources[0].status.availableReplicas > 0"
  retries: 30
  delay: 10
